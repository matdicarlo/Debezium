kind: KafkaConnect
apiVersion: kafka.strimzi.io/v1
metadata:
  name: my-connect-cluster
  namespace: streams
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: 4.1.0
  replicas: 1
  bootstrapServers: kafka-cluster-kafka-bootstrap:9092
  groupId: my-connect-group
  configStorageTopic: my-connect-configs
  statusStorageTopic: my-connect-status
  offsetStorageTopic: my-connect-offsets
  build:
    output:
      type: imagestream
      image: my-connect-with-plugins:latest
    plugins:
      - name: debezium-oracle-connector
        artifacts:
          - type: zip
            url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-oracle/2.4.0.Final/debezium-connector-oracle-2.4.0.Final-plugin.zip
          - type: jar
            url: https://repo1.maven.org/maven2/com/oracle/database/jdbc/ojdbc8/19.3.0.0/ojdbc8-19.3.0.0.jar
  config:
    config.storage.replication.factor: 3
    offset.storage.replication.factor: 3
    status.storage.replication.factor: 3
    plugin.path: /opt/kafka/plugins
